[package]
name = "atmarkdown"
version = "1.0.0"
description = "Modern Lightweight Windows Markdown Reader & Editor"
authors = ["ToolsBuilt"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = { version = "0.12", features = ["html"] }
regex = "1.10"
dirs = "5.0"
rfd = "0.15"

[profile.dev]
incremental = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
